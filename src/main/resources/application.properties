spring.application.name=sinpicarse
server.port=8080

# Base de datos relacional H2 (persistente en archivo local)
spring.datasource.url=jdbc:h2:file:./data/sinpicarse_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola visual web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=c2lucGljYXJzZV9jbGF2ZV9zZWNyZXRhX3N1cGVyX3NlZ3VyYV9wYXJhX2p3dF8yMDI2
jwt.expiration=86400000

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html